<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MudraSync | Web Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-view" class="login-screen">
        <div class="login-bg" aria-hidden="true">
            <span class="login-orb login-orb-1"></span>
            <span class="login-orb login-orb-2"></span>
            <span class="login-orb login-orb-3"></span>
            <span class="login-grid"></span>
        </div>

        <div class="glass-card" id="login-card">
            <p class="login-kicker">Expense Intelligence</p>
            <div class="brand-logo">
                <img src="auth-logo-w.png" alt="MudraSync — Personal Expenses Tracker" class="auth-logo-img">
            </div>
            <p class="subtitle">Professional expense tracking, synced with Google Sheets.</p>

            <ul class="login-highlights">
                <li><span class="dot"></span> Live analytics</li>
                <li><span class="dot"></span> Sheets sync</li>
                <li><span class="dot"></span> Instant logging</li>
            </ul>

            <button id="login-btn" class="google-btn flex items-center justify-center gap-3 bg-white border border-gray-300 shadow-sm hover:bg-gray-50" type="button">
                <span class="google-btn-inner flex items-center justify-center gap-3">
                    <img
                        src="google-logo-br.png"
                        alt=""
                        class="google-g-icon object-contain flex-shrink-0 bg-white"
                        width="28"
                        height="28"
                    >
                    <span class="leading-none">Sign in with Google</span>
                </span>
                <span class="google-btn-shine" aria-hidden="true"></span>
            </button>

            <p class="login-footnote">Secure OAuth · Your data stays in your Google Sheet</p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-view" class="app-container hidden">

        <header class="top-nav">
            <div class="nav-left">
                <button id="features-btn" class="btn btn-secondary btn-sm features-toggle" type="button" title="Features" aria-expanded="false">
                    <span class="features-toggle-icon">☰</span>
                    <span class="features-toggle-label">Features</span>
                </button>
                <div class="brand-logo-small">
                    <img src="inside web logo.png" alt="MudraSync">
                </div>
            </div>
            <div class="nav-actions">
                <span id="current-sheet-label" class="current-sheet-label hidden">Current sheet</span>
                <button id="import-sheet-btn" class="btn btn-light-grey btn-sm" type="button">Import to Google Sheet</button>
                <button id="logout-btn" class="btn btn-danger-outline btn-sm" type="button">Logout</button>
            </div>
        </header>

        <!-- DASHBOARD -->
        <main id="tracker-content" class="dashboard-layout hidden">

            <div class="summary-row">
                <div class="balance-card">
                    <p class="balance-label">Total Spends This Month</p>
                    <h1 id="monthly-total" class="balance-amount">₹0.00</h1>
                    <div class="card-chip" aria-hidden="true"></div>
                </div>

                <div class="card chart-card">
                    <div class="chart-container">
                        <canvas id="expenseChart"></canvas>
                    </div>
                </div>

                <div class="card category-card">
                    <h3>Category Breakdown</h3>
                    <ul id="category-totals" class="category-list"></ul>
                </div>
            </div>

            <div class="card form-card">
                <form id="expense-form" class="horizontal-form">
                    <input type="hidden" id="edit-index">
                    <input type="date" id="exp-date" class="field-date" required>
                    <select id="exp-category" class="field-category" required>
                        <option value="" disabled selected>Select Category</option>
                        <option value="Food">🍔 Food</option>
                        <option value="Transport">🚕 Transport</option>
                        <option value="Utilities">⚡ Utilities</option>
                        <option value="Entertainment">🎬 Entertainment</option>
                        <option value="Other">🛍️ Other</option>
                    </select>
                    <input type="text" id="exp-desc" class="field-desc" placeholder="What did you pay for?" required>
                    <input type="number" id="exp-amount" class="field-amount" placeholder="₹ Amount" step="0.01" required>
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" id="cancel-edit" class="btn btn-secondary hidden">Cancel</button>
                </form>
            </div>

            <div class="card transactions-card">
                <div class="transactions-header">
                    <h3>Recent Transactions</h3>
                </div>
                <div class="transaction-list-scrollable">
                    <div id="expense-table-body" class="tx-table"></div>
                </div>
            </div>

        </main>
    </div>

    <!-- LEFT FEATURES SLIDER (pushes / contracts main layout) -->
    <aside id="features-panel" class="features-panel" aria-hidden="true" aria-label="Features">
        <div class="features-panel-header">
            <h3>Features</h3>
            <button id="features-close-btn" class="icon-btn" type="button" aria-label="Close features">✕</button>
        </div>
        <div class="features-panel-body">
            <button type="button" class="feature-item" data-feature="1">
                <span class="feature-num">01</span>
                <div>
                    <strong>Profile</strong>
                    <p>Detail about yourself</p>
                </div>
            </button>
            <button type="button" class="feature-item" data-feature="2">
                <span class="feature-num">02</span>
                <div>
                    <strong>Settings</strong>
                    <p>For your own modification </p>
                </div>
            </button>
            <button type="button" class="feature-item" data-feature="3">
                <span class="feature-num">03</span>
                <div>
                    <strong>History</strong>
                    <p>Past saved Data sheet</p>
                </div>
            </button>
            <button type="button" class="feature-item" data-feature="4">
                <span class="feature-num">04</span>
                <div>
                    <strong> What's new </strong>
                    <p> new upgraded features </p>
                </div>
            </button>
            <button type="button" class="feature-item" data-feature="5">
                <span class="feature-num">05</span>
                <div>
                    <strong>Feedback</strong>
                    <p>Give you reviews here</p>
                </div>
            </button>
        </div>
    </aside>

    <script src="app.js"></script>
</body>
</html>
